<!doctype html>
<html lang="zh-Hant"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>@plotdb/sfx 試聽</title>
<style>
  :root { --bg: #f6f3ec; --fg: #1d1b19; --muted: #6b655d; --line: #ddd6c9; --card: #fff; --accent: #c4502f; }
  @media (prefers-color-scheme: dark) { :root { --bg: #151413; --fg: #ece7de; --muted: #9a9389; --line: #34312d; --card: #1e1c1a; --accent: #e0714d; } }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.6 system-ui, sans-serif; }
  main { max-width: 960px; margin: 0 auto; padding: 32px 16px 64px; }
  h1 { margin: 0 0 4px; font-size: 26px; }
  p.lead { margin: 0 0 24px; color: var(--muted); }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 12px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 8px; padding: 14px; display: flex; flex-direction: column; gap: 8px; }
  .card h2 { margin: 0; font-size: 16px; display: flex; justify-content: space-between; align-items: baseline; }
  .card h2 small { color: var(--muted); font-weight: 400; font-size: 12px; }
  textarea { width: 100%; box-sizing: border-box; font: 12px/1.5 ui-monospace, Menlo, monospace; background: var(--bg); color: var(--fg); border: 1px solid var(--line); border-radius: 4px; padding: 6px; resize: vertical; min-height: 34px; }
  button { align-self: flex-start; border: 0; border-radius: 4px; background: var(--accent); color: #fff; padding: 6px 14px; font: inherit; cursor: pointer; }
  .err { color: var(--accent); font-size: 12px; min-height: 1em; }
  .presets { display: flex; flex-wrap: wrap; gap: 6px; }
  .presets span { font-size: 12px; border: 1px solid var(--line); border-radius: 99px; padding: 1px 8px; cursor: pointer; color: var(--muted); }
</style></head>
<body><main>
<h1>@plotdb/sfx 試聽</h1>
<p class="lead">每種合成聲都可以改參數 ( JSON ) 再播放；點下方的小標籤套用範例參數。說明見 README。</p>
<div class="grid" id="grid"></div>
</main>
<script src="assets/sfx.js"></script>
<script>
(function () {
  const S = window.sfx;
  // 名稱、預設參數、範例
  const LIST = [
    ['click', {}, {}], ['tick', {note: 'A5'}, {}], ['pop', {from: 380, to: 900}, {'低': {from: 200, to: 420}}],
    ['toggle', {}, {}], ['type', {seed: 11}, {}], ['thump', {}, {}],
    ['chime', {note: 'E6'}, {'E5': {note: 'E5'}, '長': {note: 'B5', dur: 3}}],
    ['success', {}, {}], ['notify', {}, {}],
    ['whoosh', {dur: 0.7}, {
      '短': {dur: 0.35}, '更短更乾淨': {dur: 0.25, q: 2}, '往上衝': {dur: 0.6, from: 300, peak: 3500, to: 3000, at: 0.8},
      '往下沉': {dur: 0.6, from: 3000, peak: 3000, to: 300, at: 0.1}, '像風': {dur: 1, q: 0.5}, '像哨音': {dur: 0.6, q: 3}
    }],
    ['swell', {dur: 2}, {}],
    ['pluck', {note: 'A3'}, {'亮': {note: 'D4', bright: 0.9}, '不滑音': {note: 'A3', slide: 0}}],
    ['melody', {notes: [[0, 'A3'], [0.4, 'C4'], [0.8, 'E4'], [1.2, 'A4', 2]]}, {}],
    ['drone', {notes: ['A1', 'E2', 'B2'], dur: 6}, {}],
    ['wind', {dur: 5}, {'低沉': {dur: 5, cutoff: 400}}],
    ['rain', {dur: 5}, {'大雨': {dur: 5, density: 0.08}}],
    ['buzz', {dur: 1.5}, {'高': {dur: 1.5, freq: 330}}]
  ];
  const grid = document.getElementById('grid');
  let playing = null;
  LIST.forEach(([name, def, presets]) => {
    const card = document.createElement('div');
    card.className = 'card';
    card.innerHTML = `<h2>${name}<small></small></h2><textarea rows="2"></textarea><div class="presets"></div><button>▶ 播放</button><div class="err"></div>`;
    const ta = card.querySelector('textarea'), info = card.querySelector('small'), err = card.querySelector('.err');
    ta.value = JSON.stringify(def);
    const box = card.querySelector('.presets');
    Object.keys(presets).forEach((k) => {
      const s = document.createElement('span');
      s.textContent = k;
      s.onclick = () => { ta.value = JSON.stringify(presets[k]); play(); };
      box.appendChild(s);
    });
    const play = () => {
      err.textContent = '';
      let o;
      try { o = JSON.parse(ta.value || '{}'); } catch (e) { err.textContent = '參數不是合法的 JSON'; return; }
      S.resume();
      const buf = S.synth[name](o);
      info.textContent = `${buf.duration.toFixed(2)}s`;
      if (playing) playing.stop(0.05);
      playing = S.play(buf, {gain: 0.9});
    };
    card.querySelector('button').onclick = play;
    grid.appendChild(card);
  });
})();
</script>
</body></html>
